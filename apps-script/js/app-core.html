function debounce(fn, delay = 200) {
  let timeoutId;
  return function(...args) {
    clearTimeout(timeoutId);
    timeoutId = setTimeout(() => fn.apply(this, args), delay);
  };
}

function getServerNow() {

}

function today() {
  const d = getServerNow();
  const year = d.getFullYear();
  const month = String(d.getMonth() + 1).padStart(2, '0');
  const day = String(d.getDate()).padStart(2, '0');
  return `${year}-${month}-${day}`;
}

function updateServerTimeOffset(st) {
  if (!st || !st.timestamp) return;
  state.serverTimeOffset = st.timestamp - Date.now();
  enforceMaxDateInputs();
}

function enforceMaxDateInputs() {
  const maxDate = today();
  document.querySelectorAll('input[type="date"]').forEach(inp => {
    inp.setAttribute('max', maxDate);
  });
}

function validateDateInputNotFuture(inputEl) {
  if (!inputEl || !inputEl.value) return true;
  const maxDate = today();
  if (inputEl.value > maxDate) {
    showToast('❌ No es posible seleccionar fechas futuras.', 'error');
    inputEl.value = maxDate;
    return false;
  }
  return true;
}

function isPmAllowedForDate(fechaVal) {
  const serverToday = today();
  if (!fechaVal || fechaVal < serverToday) return true;
  if (fechaVal === serverToday) {
    return getServerNow().getHours() >= 12;
  }
  return false;
}

function formatDDMMYYYY(val) {
  if (!val) return '';
  const strVal = String(val).trim();
  if (/^\d{2}\/\d{2}\/\d{4}$/.test(strVal)) return strVal;
  const isoMatch = strVal.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
  if (isoMatch) {
    return `${isoMatch[3].padStart(2, '0')}/${isoMatch[2].padStart(2, '0')}/${isoMatch[1]}`;
  }
  const cleaned = strVal.replace(/\s*\(.*\)\s*/g, '').trim();
  const d = new Date(cleaned);
  if (!isNaN(d.getTime())) {
    const dia = String(d.getDate()).padStart(2, '0');
    const mes = String(d.getMonth() + 1).padStart(2, '0');
    const anio = d.getFullYear();
    return `${dia}/${mes}/${anio}`;
  }
  return strVal;
}
function showToast(m,t='success'){const el=document.getElementById('toast');if(el){el.textContent=m;el.className=`show toast-${t}`;setTimeout(()=>{el.className=''},3200)}}

async function fetchWithTimeout(url, options = {}, timeout = 45000, maxRetries = 1) {
  let lastError;
  const isPost = (options.method || 'GET').toUpperCase() === 'POST';
  const retries = isPost ? 0 : maxRetries;

  for (let attempt = 0; attempt <= retries; attempt++) {
    const controller = new AbortController();
    const id = setTimeout(() => controller.abort(), timeout);
    try {
      const response = await fetch(url, { ...options, signal: controller.signal });
      clearTimeout(id);
      if (response.ok) return response;
      if (!isPost && attempt < retries && (response.status >= 500 || response.status === 404)) {
        await new Promise(res => setTimeout(res, 800 * (attempt + 1)));
        continue;
      }
      return response;
    } catch (error) {
      clearTimeout(id);
      lastError = error;
      if (attempt < retries) {
        await new Promise(res => setTimeout(res, 800 * (attempt + 1)));
        continue;
      }
      throw error;
    }
  }
  throw lastError;
}
async function apiGet(p){const u=new URL(API_URL);Object.entries(p).forEach(([k,v])=>u.searchParams.set(k,v));u.searchParams.set('_t',Date.now());const r=await fetchWithTimeout(u.toString(),{redirect:'follow'});if(!r.ok)throw new Error(`HTTP ${r.status}`);return r.json()}
async function apiPost(b){const r=await fetchWithTimeout(API_URL,{method:'POST',redirect:'follow',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(b)});if(!r.ok)throw new Error(`HTTP ${r.status}`);return r.json()}

function openModuleDrawer(){
  const drawer=document.getElementById('module-drawer');
  const backdrop=document.getElementById('module-drawer-backdrop');
  if(drawer && backdrop){
    backdrop.style.display='block';
    void drawer.offsetHeight;
    backdrop.classList.add('visible');
    drawer.classList.add('open');
  }
}

function closeModuleDrawer(){
  const drawer=document.getElementById('module-drawer');
  const backdrop=document.getElementById('module-drawer-backdrop');

    drawer.classList.remove('open');
    backdrop.classList.remove('visible');

      if(!drawer.classList.contains('open')) backdrop.style.display='none';
    }, 250);

}

// ── Range check — Termo (ambiental) ──────────────────────────
function checkRangos(){
  const t=parseFloat(document.getElementById('termo-temp').value);
  const h=parseFloat(document.getElementById('termo-hum').value);
  const a=document.getElementById('alert-rangos');
  const ti=document.getElementById('temp-range-info');
  const hi=document.getElementById('hum-range-info');
  const acGroup=document.getElementById('accion-correctiva-group');
  const acSelect=document.getElementById('termo-accion');
  let out=false;
  if(!isNaN(t)){const ok=t>=18&&t<=24;ti.className='range-info '+(ok?'range-ok':'range-err');ti.textContent=ok?`✓ ${t} °C — dentro de rango`:`✗ ${t} °C — fuera de rango (18–24 °C)`;if(!ok)out=true}
  if(!isNaN(h)){const ok=h>=20&&h<=70;hi.className='range-info '+(ok?'range-ok':'range-err');hi.textContent=ok?`✓ ${h}% — dentro de rango`:`✗ ${h}% — fuera de rango (20–70%)`;if(!ok)out=true}
  a.classList.toggle('visible',out);
  if(out){acGroup.style.display='';acSelect.required=true}
  else{acGroup.style.display='none';acSelect.required=false;acSelect.value=''}
}

  document.getElementById('temp-range-info').className='range-info';

}
function isOutOfRange(){
  const t=parseFloat(document.getElementById('termo-temp').value);
  const h=parseFloat(document.getElementById('termo-hum').value);
  const issues=[];
  if(!isNaN(t)&&(t<18||t>24))issues.push(`Temperatura: ${t} °C (rango: 18–24 °C)`);
  if(!isNaN(h)&&(h<20||h>70))issues.push(`Humedad: ${h}% (rango: 20–70%)`);
  return issues.length?issues:false;
}

// ── Helpers ───────────────────────────────────────────────────
function escapeHtml(str) {
  if (str === null || str === undefined) return '';
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#039;');
}

function normalizeMsText(s) {
  return String(s || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().trim();
}

// ── Touch Gesture Guard for MultiSelect ──────────────────────
var msTouchStartY = 0;
var msTouchStartX = 0;
var msIsScrolling = false;
var msScrollTimer = null;

document.addEventListener('touchstart', (e) => {
  if (e.touches && e.touches.length > 0) {
    msTouchStartY = e.touches[0].clientY;
    msTouchStartX = e.touches[0].clientX;
    msIsScrolling = false;
  }
}, { passive: true });

document.addEventListener('touchmove', (e) => {
  if (!msIsScrolling && e.touches && e.touches.length > 0) {
    const diffY = Math.abs(e.touches[0].clientY - msTouchStartY);
    const diffX = Math.abs(e.touches[0].clientX - msTouchStartX);
    if (diffY > 10 || diffX > 10) {
      msIsScrolling = true;
    }
  }
}, { passive: true });

document.addEventListener('touchend', () => {
  if (msScrollTimer) clearTimeout(msScrollTimer);
  msScrollTimer = setTimeout(() => {
    msIsScrolling = false;
  }, 250);
}, { passive: true });

document.addEventListener('touchcancel', () => {
  if (msScrollTimer) clearTimeout(msScrollTimer);
  msIsScrolling = false;
}, { passive: true });

function handleOptionClick(el, e) {
  if (msIsScrolling) {
    msIsScrolling = false;
    if (e) {
      e.preventDefault();
      e.stopPropagation();
    }
    return false;
  }
  toggleChip(el);
}

function toggleChip(el) {
  el.classList.toggle('selected');
  el.setAttribute('aria-selected', el.classList.contains('selected') ? 'true' : 'false');
  const container = el.closest('.custom-multiselect') || el.closest('#cent-chips, #meson-chips, #limp-refri-chips, #rev-chips') || (el.parentElement ? el.parentElement : null);
  const parentId = container ? container.id : '';
  if (parentId === 'cent-chips' && typeof checkDuplicateCentrifugas === 'function') checkDuplicateCentrifugas();
  else if (parentId === 'meson-chips' && typeof checkDuplicateMesones === 'function') checkDuplicateMesones();
  if (parentId) updateMultiSelectUI(parentId);
}

function centNum(name) {
  const m = String(name || '').match(/(\d+)/);
  return m ? parseInt(m[1], 10) : 0;
}

function getSelectedChips(id) {
  return Array.from(document.querySelectorAll(`#${id} .chip-item.selected`)).map(i => i.dataset.value);
}

  const allPreSelected = preChips.length > 0 && preChips.every(c => c.classList.contains('selected'));
  const willSelect = !allPreSelected;

  if (btn) btn.classList.toggle('active', willSelect);
  preChips.forEach(c => {
    if (willSelect) {
      c.classList.add('selected');
      c.setAttribute('aria-selected', 'true');
    } else {
      c.classList.remove('selected');
      c.setAttribute('aria-selected', 'false');
    }
  });

  updateMultiSelectUI('cent-chips');
}

function toggleMultiSelect(containerId, e) {
  if (msIsScrolling) {
    msIsScrolling = false;
    if (e) {
      e.stopPropagation();
      e.preventDefault();
    }
    return;
  }
  if (e) {
    e.stopPropagation();
    e.preventDefault();
  }
  const panel = document.getElementById(`ms-dropdown-${containerId}`);
  const chevron = document.getElementById(`ms-chevron-${containerId}`);
  const trigger = document.getElementById(`ms-trigger-${containerId}`);
  if (!panel) return;
  const isOpen = panel.style.display !== 'none';
  if (isOpen) {
    closeMultiSelect(containerId);
  } else {
    closeAllMultiSelects();
    panel.style.display = 'block';
    if (chevron) chevron.classList.add('open');
    if (trigger) {
      trigger.classList.add('active');
      trigger.setAttribute('aria-expanded', 'true');
    }
    const searchInp = document.getElementById(`ms-search-${containerId}`);
    if (searchInp && !(window.matchMedia && window.matchMedia('(pointer: coarse)').matches)) {
      setTimeout(() => searchInp.focus(), 60);
    }
  }
}

function closeMultiSelect(containerId) {
  if (msIsScrolling) return;
  const panel = document.getElementById(`ms-dropdown-${containerId}`);
  const chevron = document.getElementById(`ms-chevron-${containerId}`);
  const trigger = document.getElementById(`ms-trigger-${containerId}`);
  if (panel) panel.style.display = 'none';
  if (chevron) chevron.classList.remove('open');
  if (trigger) {
    trigger.classList.remove('active');
    trigger.setAttribute('aria-expanded', 'false');
  }
}

function closeAllMultiSelects() {
  document.querySelectorAll('.ms-dropdown-panel').forEach(p => p.style.display = 'none');
  document.querySelectorAll('.ms-chevron').forEach(c => c.classList.remove('open'));
  document.querySelectorAll('.ms-trigger').forEach(t => {
    t.classList.remove('active');
    t.setAttribute('aria-expanded', 'false');
  });
}

document.addEventListener('click', (e) => {

    e.stopPropagation();

    return;
  }
  if (!e.target.closest('.custom-multiselect')) {
    closeAllMultiSelects();
  }
});

document.addEventListener('keydown', (e) => {

    closeAllMultiSelects();
  }
});

function removeSelectedItem(containerId, value, e) {
  msIsScrolling = false;
  if (e) {
    if (typeof e.stopPropagation === 'function') e.stopPropagation();
    if (typeof e.preventDefault === 'function') e.preventDefault();
  }
  if (value === undefined || value === null) return;
  const container = document.getElementById(containerId);
  if (!container) return;
  const targetVal = String(value);
  const chip = Array.from(container.querySelectorAll('.chip-item')).find(c => String(c.dataset.value) === targetVal);
  if (chip) {
    chip.classList.remove('selected');
    chip.setAttribute('aria-selected', 'false');
    if (containerId === 'cent-chips' && typeof checkDuplicateCentrifugas === 'function') checkDuplicateCentrifugas();
    else if (containerId === 'meson-chips' && typeof checkDuplicateMesones === 'function') checkDuplicateMesones();
    updateMultiSelectUI(containerId);
  }
}

function filterMultiSelect(containerId, query) {
  const container = document.getElementById(containerId);
  if (!container) return;
  const q = normalizeMsText(query);
  const items = container.querySelectorAll('.ms-option-item');
  items.forEach(item => {
    const val = item.dataset.value || '';
    const lbl = item.dataset.label || val;
    const text = normalizeMsText(val + ' ' + lbl);
    if (!q || text.includes(q)) {
      item.style.display = 'flex';
    } else {
      item.style.display = 'none';
    }
  });
}

function updateMultiSelectUI(containerId) {
  const container = document.getElementById(containerId);
  if (!container) return;
  if (container._msUpdating) return;
  container._msUpdating = true;

  try {
    const cfg = MULTISELECT_CONFIGS[containerId] || {
      icon: '📌',
      singular: 'elemento',
      plural: 'elementos',
      gender: 'm',
      placeholder: 'Seleccionar elementos…'
    };

    const allChips = container.querySelectorAll('.chip-item');
    const selectedChips = container.querySelectorAll('.chip-item.selected');
    const count = selectedChips.length;

    const textEl = document.getElementById(`ms-text-${containerId}`);
    const badgeEl = document.getElementById(`ms-badge-${containerId}`);

    if (textEl) {
      if (count === 0) {
        textEl.textContent = cfg.placeholder;
        textEl.classList.remove('has-selection');
      } else if (count === 1) {
        const firstChip = selectedChips[0];
        const firstLabel = firstChip.dataset.label || firstChip.dataset.value;
        textEl.textContent = `1 ${cfg.singular}: ${firstLabel}`;
        textEl.classList.add('has-selection');
      } else {
        const selWord = cfg.gender === 'f' ? 'seleccionadas' : 'seleccionados';
        textEl.textContent = `${count} ${cfg.plural} ${selWord}`;
        textEl.classList.add('has-selection');
      }
    }

    if (badgeEl) {
      if (count > 0) {
        badgeEl.textContent = String(count);
        badgeEl.style.display = 'inline-flex';
      } else {
        badgeEl.style.display = 'none';
      }
    }

    const trayEl = document.getElementById(`ms-tags-${containerId}`);
    if (trayEl) {
      if (count > 0) {
        trayEl.style.display = 'flex';
        trayEl.innerHTML = Array.from(selectedChips).map(chip => {
          const val = chip.dataset.value || '';
          const lbl = chip.dataset.label || val;
          return `
          <span class="ms-selected-tag" data-value="${escapeHtml(val)}">
            <span class="ms-tag-text">${escapeHtml(lbl)}</span>
            <button type="button" class="ms-tag-remove" data-container="${containerId}" data-value="${escapeHtml(val)}" onclick="removeSelectedItem('${containerId}', this.dataset.value, event)" title="Quitar ${escapeHtml(lbl)}" aria-label="Quitar ${escapeHtml(lbl)}">✕</button>
          </span>`;
        }).join('') + (count > 1 ? `<button type="button" class="ms-clear-tray-btn" data-container="${containerId}" onclick="clearAllMultiSelect('${containerId}', event)" title="Quitar todas">Limpiar</button>` : '');
      } else {
        trayEl.style.display = 'none';
        trayEl.innerHTML = '';
      }
    }

    if (containerId === 'cent-chips') {
      const preBtn = document.getElementById('btn-grupo-preanalisis');
      const msPreBtn = container.querySelector('.ms-preanalisis-btn');
      const preChips = Array.from(allChips).filter(ch => PREANALISIS.includes(centNum(ch.dataset.value)));
      const allPreSelected = preChips.length > 0 && preChips.every(c => c.classList.contains('selected'));
      if (preBtn) preBtn.classList.toggle('active', allPreSelected);
      if (msPreBtn) msPreBtn.classList.toggle('active', allPreSelected);
    }

    if (containerId === 'rev-chips') {
      const revBtn = document.getElementById('btn-rev-select-all');
      const allSel = allChips.length > 0 && selectedChips.length === allChips.length;
      if (revBtn) revBtn.classList.toggle('active', allSel);
    }
  } finally {
    container._msUpdating = false;
  }
}

function initMultiSelectObserver(containerId) {
  const container = document.getElementById(containerId);
  if (!container || container._msObserverInit) return;
  container._msObserverInit = true;

  if (typeof MutationObserver !== 'undefined') {
    const observer = new MutationObserver((mutations) => {
      if (container._msUpdating) return;
      let shouldUpdate = false;
      for (const m of mutations) {
        if (m.type === 'attributes' && m.attributeName === 'class' && m.target && m.target.classList && m.target.classList.contains('chip-item')) {
          shouldUpdate = true;
          break;
        }
      }
      if (shouldUpdate) {
        updateMultiSelectUI(containerId);
      }
    });

    observer.observe(container, {
      attributes: true,
      attributeFilter: ['class'],
      subtree: true
    });
  }
}

// ── Personal & Responsables Helpers (Optimized O(1) Hash Map) ─
function getNombreResponsable(rawVal) {
  if (!rawVal) return '';
  const trimmed = String(rawVal).trim();
  const upper = trimmed.toUpperCase();
  if (state.personalMap && state.personalMap[upper]) {
    const p = state.personalMap[upper];
    if (p.activo !== 'NO' && p.nombre) return p.nombre;
  }
  return trimmed;
}

function getInicialesResponsable(val) {
  if (!val) return '';
  const trimmed = String(val).trim();
  const upper = trimmed.toUpperCase();
  if (state.personalMap && state.personalMap[upper]) {
    return state.personalMap[upper].iniciales;
  }
  if (state.personalByNameMap && state.personalByNameMap[upper]) {
    return state.personalByNameMap[upper].iniciales;
  }
  if (trimmed.length <= 4) return upper;
  return trimmed.split(/\s+/).map(w => w[0]).join('').toUpperCase().substring(0, 4);
}

function updateResponsableFeedback(inputEl) {
  if (!inputEl) return;
  const val = inputEl.value.trim().toUpperCase();
  let feedbackEl = inputEl.parentElement.querySelector('.resp-feedback');
  if (!feedbackEl) {
    feedbackEl = document.createElement('div');
    feedbackEl.className = 'resp-feedback';
    inputEl.parentElement.appendChild(feedbackEl);
  }
  if (!val) {
    feedbackEl.textContent = '';
    feedbackEl.className = 'resp-feedback';
    return;
  }
  const match = (state.personal || []).find(p => p.iniciales === val && p.activo !== 'NO');
  if (match && match.nombre) {
    feedbackEl.className = 'resp-feedback found';
    feedbackEl.textContent = '✓ ' + match.nombre + (match.estamento ? ' (' + match.estamento + ')' : '');
  } else if (val.length >= 2) {
    feedbackEl.className = 'resp-feedback unknown';
    feedbackEl.textContent = '👤 Inicial nueva (se registrará al guardar)';
  } else {
    feedbackEl.textContent = '';
    feedbackEl.className = 'resp-feedback';
  }
}

function bindResponsableLiveFeedback() {
  const inputs = document.querySelectorAll('input[id$="-resp"], input[id$="-responsable"], #elim-responsable, #rev-admin-revisor, #edit-termo-resp, #edit-cent-resp, #edit-meson-resp, #edit-refri-resp, #edit-limp-refri-resp, #edit-conduct-resp, #edit-cobas-resp');
  inputs.forEach(inp => {
    if (!inp._respBound) {
      inp._respBound = true;
      inp.addEventListener('input', () => updateResponsableFeedback(inp));
      inp.addEventListener('focus', () => updateResponsableFeedback(inp));
    }
  });
}

let nuevoPersonalPromiseResolver = null;

async function ensureResponsableRegistered(rawInitials) {
  if (!rawInitials) return true;
  const val = String(rawInitials).trim().toUpperCase();
  if (!val) return true;

  // Si ya contiene espacios o más de 4 letras, asumir que ya es nombre completo
  if (val.includes(' ') || val.length > 4) return true;

  const match = (state.personal || []).find(p => p.iniciales === val && p.activo !== 'NO');
  if (match && match.nombre) {
    return true; // Ya registrado en maestro
  }

  // Desplegar modal para ingresar nombre
  return new Promise((resolve) => {
    nuevoPersonalPromiseResolver = resolve;
    const modal = document.getElementById('modal-nuevo-personal');
    const initInput = document.getElementById('nuevo-personal-iniciales');
    const nameInput = document.getElementById('nuevo-personal-nombre');
    if (initInput) initInput.value = val;
    if (nameInput) {
      nameInput.value = '';
      setTimeout(() => nameInput.focus(), 150);
    }
    if (modal) {
      const card = modal.querySelector('.modal-card, .nuevo-personal-card') || modal.firstElementChild;
      if (card) card.style.display = 'block';
      modal.style.display = 'flex';
      modal.style.zIndex = '10000';
    }
  });
}

function cerrarModalNuevoPersonal() {
  const modal = document.getElementById('modal-nuevo-personal');
  if (modal) modal.style.display = 'none';
  if (nuevoPersonalPromiseResolver) {
    nuevoPersonalPromiseResolver(false);
    nuevoPersonalPromiseResolver = null;
  }
}

async function handleGuardarNuevoPersonal(e) {
  if (e) e.preventDefault();
  const iniciales = document.getElementById('nuevo-personal-iniciales').value.trim().toUpperCase();
  const nombre = document.getElementById('nuevo-personal-nombre').value.trim().toUpperCase();
  const estamento = document.getElementById('nuevo-personal-estamento').value;

  if (!nombre) {
    showToast('Ingrese su nombre completo', 'warning');
    return;
  }

  const btn = document.getElementById('btn-guardar-nuevo-personal');
  if (btn) btn.disabled = true;

  try {
    const res = await apiPost({
      action: 'savePersonal',
      iniciales: iniciales,
      nombre: nombre,
      estamento: estamento,
      activo: 'SI'
    });

    if (res && res.success) {
      showToast(`✓ Funcionario ${nombre} registrado exitosamente`, 'success');
      if (res.personal) {
        state.personal = res.personal;
      } else {
        state.personal.push({ iniciales, nombre, estamento, activo: 'SI' });
      }
      rebuildPersonalIndex();
      document.querySelectorAll('input[id$="-resp"], input[id$="-responsable"], #elim-responsable').forEach(inp => {
        if (inp.value.trim().toUpperCase() === iniciales) updateResponsableFeedback(inp);
      });
      const modal = document.getElementById('modal-nuevo-personal');
      if (modal) modal.style.display = 'none';
      if (nuevoPersonalPromiseResolver) {
        nuevoPersonalPromiseResolver(true);
        nuevoPersonalPromiseResolver = null;
      }
    } else {
      showToast(res.error || 'Error al registrar funcionario', 'error');
    }
  } catch (err) {
    showToast('Error de conexión: ' + err.toString(), 'error');
  } finally {
    if (btn) btn.disabled = false;
  }
}

// URL params
function checkUrlParams(){
  const p=new URLSearchParams(window.location.search);
  let area=p.get('area'),
      sala=p.get('sala'),
      cent=p.get('centrifuga'),
      grupo=p.get('grupo'),
      refri=p.get('refri'),
      limprefri=p.get('limprefri'),
      modulo=p.get('modulo'),
      etName=p.get('etiquetadora'),
      cobasEq=p.get('cobas'),
      elimSector=p.get('sector') || p.get('tipo');
      
  if (window.QR_PARAMS) {
    if (!area) area = window.QR_PARAMS.area;
    if (!sala) sala = window.QR_PARAMS.sala;
    if (!cent) cent = window.QR_PARAMS.centrifuga;
    if (!grupo) grupo = window.QR_PARAMS.grupo;
    if (!refri) refri = window.QR_PARAMS.refri;
    if (!limprefri) limprefri = window.QR_PARAMS.limprefri;
    if (!modulo) modulo = window.QR_PARAMS.modulo;
    if (!etName) etName = window.QR_PARAMS.etiquetadora;
    if (!cobasEq) cobasEq = window.QR_PARAMS.cobas;
    if (!elimSector) elimSector = window.QR_PARAMS.sector || window.QR_PARAMS.tipo;
  }

  if(area){
    document.getElementById('area-prefill-name').textContent=area;
    document.getElementById('area-prefill-indicator').style.display='block';
    const w=setInterval(()=>{
      const s=document.getElementById('termo-area');
      if(Array.from(s.options).find(o=>o.value===area)){
        s.value=area;
        clearInterval(w);
      }
    },300);
    navigateTo('termo');
  }
  if(sala){
    const w=setInterval(()=>{
      const chips=document.querySelectorAll('#meson-chips .chip-item');
      if(chips.length){
        chips.forEach(c=>{
          if(c.dataset.value===sala) c.classList.add('selected');
        });
        clearInterval(w);
        updateMultiSelectUI('meson-chips');
      }
    },300);
    navigateTo('mesones');
  }
  if(cent){
    const w=setInterval(()=>{
      const chips=document.querySelectorAll('#cent-chips .chip-item');
      if(chips.length){
        chips.forEach(c=>{
          if(c.dataset.value===cent) c.classList.add('selected');
        });
        clearInterval(w);
        updateMultiSelectUI('cent-chips');
      }
    },300);
    navigateTo('centrifugas');
  }
  if(grupo==='preanalisis'){
    const w=setInterval(()=>{
      const chips=document.querySelectorAll('#cent-chips .chip-item');
      if(chips.length){
        document.getElementById('btn-grupo-preanalisis').classList.add('active');
        chips.forEach(c=>{
          if(PREANALISIS.includes(centNum(c.dataset.value))) c.classList.add('selected');
        });
        clearInterval(w);
        updateMultiSelectUI('cent-chips');
      }
    },300);
    navigateTo('centrifugas');
  }
  if(refri){
    const w=setInterval(()=>{
      const s=document.getElementById('refri-equipo');
      if(Array.from(s.options).find(o=>o.value===refri)){
        s.value=refri;
        checkRangoRefri();
        clearInterval(w);
      }
    },300);
    navigateTo('refri-temp');
  }
  if(limprefri){
    const w=setInterval(()=>{
      const chips=document.querySelectorAll('#limp-refri-chips .chip-item');
      if(chips.length){
        chips.forEach(c=>{
          if(c.dataset.value===limprefri) c.classList.add('selected');
        });
        clearInterval(w);
        updateMultiSelectUI('limp-refri-chips');
      }
    },300);
    navigateTo('limp-refri');
  }
  if(modulo==='conductividad'){
    navigateTo('conductividad');
  }
  if(modulo==='dxh900'){
    navigateTo('dxh900');
  }
  if(etName){
    document.getElementById('etiquetadora-prefill-name').textContent=etName;
    document.getElementById('etiquetadora-prefill-indicator').style.display='block';
    const w=setInterval(()=>{
      if(state.etiquetadoras&&state.etiquetadoras.length){
        const found=state.etiquetadoras.find(o=>o.nombreReal===etName);
        if(found){
          const displayText=`${found.nombreReal} - ${found.piso} - ${found.ubicacion}`;
          document.getElementById('etiquetadora-search-input').value=displayText;
          document.getElementById('btn-clear-et-search').style.display='block';
          const s=document.getElementById('etiquetadora-select');
          s.value=etName;
          onEtiquetadoraChange();
          clearInterval(w);
        }else{
          clearInterval(w);
        }
      }
    },300);
    navigateTo('etiquetadoras');
  }
  if(cobasEq){
    const w=setInterval(()=>{
      const s=document.getElementById('cobas-equipo');
      if(Array.from(s.options).find(o=>o.value===cobasEq)){
        s.value=cobasEq;
        clearInterval(w);
      }
    },300);
    navigateTo('cobas');
  }
  if(modulo==='cobas'){
    navigateTo('cobas');
  }
  if(modulo==='elim-muestras' || elimSector){
    if(elimSector){
      const decodedSector = decodeURIComponent(elimSector).trim();
      const ind=document.getElementById('elim-sector-prefill-indicator');
      const indName=document.getElementById('elim-sector-prefill-name');
      if(ind && indName){
        indName.textContent=decodedSector;
        ind.style.display='block';
      }
      const setSector = () => {
        const s = document.getElementById('elim-sector');
        if (!s) return false;
        const target = decodedSector.toLowerCase();
        const opt = Array.from(s.options).find(o => o.value.trim().toLowerCase() === target);
        if (opt) {
          s.value = opt.value;
          if (typeof onElimSectorChange === 'function') onElimSectorChange();
          return true;
        }
        return false;
      };
      if (!setSector()) {
        const w = setInterval(() => {
          if (setSector()) clearInterval(w);
        }, 100);
        setTimeout(() => clearInterval(w), 5000);
      }
    }
    navigateTo('elim-muestras');
  }
}

// Dashboard cache & prefetch (decoupled with debounce)
let _prefetchDashboardTimer = null;
function prefetchDashboard(delay = 2000){
  if (_prefetchDashboardTimer) clearTimeout(_prefetchDashboardTimer);
  _prefetchDashboardTimer = setTimeout(() => {
    const mes=state.dashMes,anio=state.dashAnio;
    const key=mes+'-'+anio;
    apiGet({action:'getRegistros',mes:mes,anio:anio}).then(function(reg){
      const rev = reg.revisiones || null;
      state.dashCache={key:key,data:reg,rev:rev,timestamp:Date.now()};
    }).catch(function(){/* silent fail */});
  }, delay);
}
function getCacheAge(){
  if(!state.dashCache)return Infinity;
  return(Date.now()-state.dashCache.timestamp)/1000/60; // minutes
}
function updateCacheIndicator(){
  const el=document.getElementById('dash-cache-indicator');
  if(!el)return;
  if(!state.dashCache){el.style.display='none';return;}
  const mins=Math.round(getCacheAge());
  if(mins<1){el.textContent='✓ Actualizado';el.className='cache-indicator cache-fresh'}
  else if(mins<5){el.textContent='hace '+mins+' min';el.className='cache-indicator cache-fresh'}
  else{el.textContent='hace '+mins+' min';el.className='cache-indicator cache-stale'}
  el.style.display='inline-block';
}
