function debounce(fn, delay = 200) {
  let timeoutId;
  return function(...args) {
    clearTimeout(timeoutId);
    timeoutId = setTimeout(() => fn.apply(this, args), delay);
  };
}

function validateDateInputNotFuture(inputEl) {
  if (!inputEl || !inputEl.value) return true;
  const maxDate = today();
  if (inputEl.value > maxDate) {
    showToast('❌ No es posible seleccionar fechas futuras.', 'error');
    inputEl.value = maxDate;
    return false;
  }
  return true;
}

function isPmAllowedForDate(fechaVal) {
  const serverToday = today();
  if (!fechaVal || fechaVal < serverToday) return true;
  if (fechaVal === serverToday) {
    return getServerNow().getHours() >= 12;
  }
  return false;
}

function formatDDMMYYYY(val) {
  if (!val) return '';
  const strVal = String(val).trim();
  if (/^\d{2}\/\d{2}\/\d{4}$/.test(strVal)) return strVal;
  const isoMatch = strVal.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
  if (isoMatch) {
    return `${isoMatch[3].padStart(2, '0')}/${isoMatch[2].padStart(2, '0')}/${isoMatch[1]}`;
  }
  const cleaned = strVal.replace(/\s*\(.*\)\s*/g, '').trim();
  const d = new Date(cleaned);
  if (!isNaN(d.getTime())) {
    const dia = String(d.getDate()).padStart(2, '0');
    const mes = String(d.getMonth() + 1).padStart(2, '0');
    const anio = d.getFullYear();
    return `${dia}/${mes}/${anio}`;
  }
  return strVal;
}

async function fetchWithTimeout(url, options = {}, timeout = 45000, maxRetries = 2) {
  let lastError;
  const isPost = (options.method || 'GET').toUpperCase() === 'POST';
  const retries = isPost ? 0 : maxRetries;

  for (let attempt = 0; attempt <= retries; attempt++) {
    const controller = new AbortController();
    const id = setTimeout(() => {
      try {
        controller.abort(new Error(`Timeout de red (${Math.round(timeout / 1000)}s)`));
      } catch (e) {
        controller.abort();
      }
    }, timeout);
    try {
      const response = await fetch(url, { ...options, signal: controller.signal });
      clearTimeout(id);
      if (response.ok) return response;
      if (!isPost && attempt < retries && (response.status >= 500 || response.status === 404)) {
        await new Promise(res => setTimeout(res, 1000 * (attempt + 1)));
        continue;
      }
      return response;
    } catch (error) {
      clearTimeout(id);
      lastError = error;
      if (attempt < retries) {
        await new Promise(res => setTimeout(res, 1200 * (attempt + 1)));
        continue;
      }
      throw error;
    }
  }
  throw lastError;
}

function canUseGoogleScriptRun() {
  return typeof google !== 'undefined' &&
         typeof google.script !== 'undefined' &&
         typeof google.script.run !== 'undefined';
}

function callGoogleScriptRun(action, payload) {
  return new Promise((resolve, reject) => {
    let settled = false;
    const timer = setTimeout(() => {
      if (!settled) {
        settled = true;
        reject(new Error(`Timeout RPC google.script.run para '${action}'`));
      }
    }, 35000);

    try {
      google.script.run
        .withSuccessHandler(res => {
          if (!settled) {
            settled = true;
            clearTimeout(timer);
            if (typeof res === 'string') {
              try {
                return resolve(JSON.parse(res));
              } catch (e) {
                return resolve(res);
              }
            }
            resolve(res);
          }
        })
        .withFailureHandler(err => {
          if (!settled) {
            settled = true;
            clearTimeout(timer);
            const msg = (err && err.message) ? err.message : String(err);
            reject(new Error(msg));
          }
        })
        .apiRun(action, payload);
    } catch (e) {
      if (!settled) {
        settled = true;
        clearTimeout(timer);
        reject(e);
      }
    }
  });
}

const inFlightApiGets = new Map();

async function apiGet(p) {
  const action = p && p.action ? p.action : 'unknown';
  const dedupeKey = JSON.stringify(p);
  if (inFlightApiGets.has(dedupeKey)) {
    return inFlightApiGets.get(dedupeKey);
  }

  const promise = (async () => {
    try {
      // 1. Si estamos dentro de Google Apps Script iframe, intentar vía google.script.run (sin HTTP, sin CORS)
      if (canUseGoogleScriptRun()) {
        try {
          const res = await callGoogleScriptRun(action, p);
          if (res !== undefined && res !== null) return res;
        } catch (rpcErr) {
          console.warn(`google.script.run (${action}) falló:`, rpcErr);
          if (window.location.hostname.includes('googleusercontent.com') || window.location.hostname.includes('script.google.com')) {
            throw rpcErr;
          }
        }
      }

      // 2. Fallback resiliente HTTP GET con URL universal limpia
      const cleanUrl = getCanonicalApiUrl(API_URL);
      const u = new URL(cleanUrl);
      Object.entries(p).forEach(([k, v]) => u.searchParams.set(k, v));
      u.searchParams.set('_t', Date.now());

      const r = await fetchWithTimeout(u.toString(), { redirect: 'follow' }, 45000, 2);
      if (!r.ok) throw new Error(`HTTP ${r.status}`);
      return await r.json();
    } finally {
      inFlightApiGets.delete(dedupeKey);
    }
  })();

  inFlightApiGets.set(dedupeKey, promise);
  return promise;
}

let isSubmittingGlobal = false;
let lastSubmitPayload = '';
let lastSubmitTime = 0;

async function apiPost(b) {
  const action = b && b.action ? b.action : 'unknown';
  const currentPayload = JSON.stringify(b);
  const now = Date.now();
  // Bloquear reintentos idénticos accidentales mientras haya un envío en curso o dentro de los primeros 5 segundos
  if (isSubmittingGlobal && currentPayload === lastSubmitPayload && (now - lastSubmitTime) < 5000) {
    console.warn('Envío repetido bloqueado en cliente:', action);
    return { success: true, message: 'Su registro ya se está procesando...' };
  }
  isSubmittingGlobal = true;
  lastSubmitPayload = currentPayload;
  lastSubmitTime = now;

  try {
    // 1. Si estamos dentro de Google Apps Script iframe, enviar directo vía google.script.run (cero CORS, guardado garantizado)
    if (canUseGoogleScriptRun()) {
      try {
        const res = await callGoogleScriptRun(action, b);
        if (res !== undefined && res !== null) return res;
      } catch (rpcErr) {
        console.warn(`google.script.run POST (${action}) falló:`, rpcErr);
        if (window.location.hostname.includes('googleusercontent.com') || window.location.hostname.includes('script.google.com')) {
          throw rpcErr;
        }
      }
    }

    // 2. Fallback resiliente HTTP POST con URL canónica limpia
    const cleanUrl = getCanonicalApiUrl(API_URL);
    const r = await fetchWithTimeout(cleanUrl, {
      method: 'POST',
      redirect: 'follow',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: currentPayload
    }, 45000, 0);
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    return await r.json();
  } finally {
    setTimeout(() => {
      isSubmittingGlobal = false;
    }, 1500);
  }
}

// Navigation
function navigateTo(s){
  if(s!=='dashboard'&&s!=='admin'&&!isModuloActivo(s)){
    navigateTo('dashboard');
    return;
  }
  document.querySelectorAll('.section').forEach(el=>el.classList.remove('active'));
  document.querySelectorAll('.nav-item').forEach(n=>n.classList.remove('active'));
  const sec=document.getElementById('section-'+s);
  if(sec)sec.classList.add('active');
  document.querySelectorAll(`[data-section="${s}"]`).forEach(navBtn=>navBtn.classList.add('active'));
  const moreBtn = document.getElementById('btn-more-modules');
  if (moreBtn) {
    const isPrimary = ['dashboard', 'termo', 'cobas', 'elim-muestras'].includes(s);
    moreBtn.classList.toggle('sub-active', !isPrimary);
  }
  if (typeof closeModuleDrawer === 'function') {
    closeModuleDrawer();
  }
  window.scrollTo({ top: 0, behavior: 'smooth' });
  if(s==='dashboard')loadDashboard();
  if(s==='admin'){initRevAdminSelectors();loadNotificacionesAdmin();if(typeof loadModulosAdmin==='function')loadModulosAdmin();if(typeof loadDiasNoHabilesAdmin==='function')loadDiasNoHabilesAdmin();}

function toggleModuleDrawer(e){
  if(e) e.stopPropagation();
  const drawer=document.getElementById('module-drawer');
  if(!drawer) return;
  if(drawer.classList.contains('open')) closeModuleDrawer();
  else openModuleDrawer();
}

function openModuleDrawer(){
  const drawer=document.getElementById('module-drawer');
  const backdrop=document.getElementById('module-drawer-backdrop');
  if(drawer && backdrop){
    backdrop.style.display='block';
    void drawer.offsetHeight;
    backdrop.classList.add('visible');
    drawer.classList.add('open');
  }
}

function closeModuleDrawer(){
  const drawer=document.getElementById('module-drawer');
  const backdrop=document.getElementById('module-drawer-backdrop');
  if(drawer && backdrop){
    drawer.classList.remove('open');
    backdrop.classList.remove('visible');
    setTimeout(()=>{
      if(!drawer.classList.contains('open')) backdrop.style.display='none';
    }, 250);
  }
}

// Load masters with instant server injection, sessionStorage hydration or resilient API fetch
async function loadMaestros() {
  // 1. Si los datos fueron inyectados directamente por el servidor Apps Script en doGet, usarlos de inmediato (0 ms)
  if (window.INITIAL_MAESTROS && window.INITIAL_MAESTROS.areas && !state.dashMaestros) {
    applyMaestrosData(window.INITIAL_MAESTROS);
    try {
      sessionStorage.setItem('dashMaestros', JSON.stringify(window.INITIAL_MAESTROS));
    } catch (e) {}
    state.maestrosPromise = Promise.resolve(window.INITIAL_MAESTROS);
    return window.INITIAL_MAESTROS;
  }

  // 2. Si hay caché en sessionStorage (visitas previas en la misma sesión), hidratar de inmediato
  if (!state.dashMaestros) {
    try {
      const cachedStr = sessionStorage.getItem('dashMaestros');
      if (cachedStr) {
        const cached = JSON.parse(cachedStr);
        if (cached && cached.areas) {
          applyMaestrosData(cached);
        }
      }
    } catch (e) {}
  }

  if (state.maestrosPromise && state.dashMaestros) {
    return state.maestrosPromise;
  }

  state.maestrosPromise = (async () => {
    try {
      const data = await apiGet({ action: 'getMaestros' });
      if (data && data.areas) {
        try {
          sessionStorage.setItem('dashMaestros', JSON.stringify(data));
        } catch (e) {}
        applyMaestrosData(data);
        return data;
      }
      throw new Error('Respuesta de maestros no contiene estructura válida');
    } catch (e) {
      console.warn('Aviso: problema al cargar maestros de la API:', e);
      if (!state.dashMaestros) {
        showToast('⚠️ Conexión lenta al servidor. Reintentando maestros en segundo plano...', 'warning');
        // Reintentar automáticamente en 3.5 segundos sin envenenar el estado con datos ficticios
        setTimeout(() => {
          state.maestrosPromise = null;
          loadMaestros();
        }, 3500);
      }
    }
  })();
  return state.maestrosPromise;
}

function populateSelect(id, items, ph) {
  const s = (typeof id === 'string') ? document.getElementById(id) : id;
  if (!s) return;
  const currentVal = s.value;
  const list = items || [];
  let html = `<option value="">${ph}</option>` + list.map(i => {
    const v = (typeof i === 'object' && i !== null) ? (i.value !== undefined ? i.value : (i.nombre || '')) : i;
    const l = (typeof i === 'object' && i !== null) ? (i.label !== undefined ? i.label : (i.nombre || i.value || '')) : i;
    return `<option value="${escapeHtml(String(v))}">${escapeHtml(String(l))}</option>`;
  }).join('');
  s.innerHTML = html;
  if (currentVal) {
    const exists = Array.from(s.options).some(o => o.value === currentVal);
    if (exists) {
      s.value = currentVal;
    } else {
      const opt = document.createElement('option');
      opt.value = currentVal;
      opt.textContent = currentVal;
      s.appendChild(opt);
      s.value = currentVal;
    }
  }
}

// ── Helpers ───────────────────────────────────────────────────
function escapeHtml(str) {
  if (str === null || str === undefined) return '';
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#039;');
}

function normalizeMsText(s) {
  return String(s || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().trim();
}

var msTouchStartY = 0;
var msTouchStartX = 0;
var msIsScrolling = false;
var msScrollTimer = null;

document.addEventListener('touchstart', (e) => {
  if (e.touches && e.touches.length > 0) {
    msTouchStartY = e.touches[0].clientY;
    msTouchStartX = e.touches[0].clientX;
    msIsScrolling = false;
  }
}, { passive: true });

document.addEventListener('touchmove', (e) => {
  if (!msIsScrolling && e.touches && e.touches.length > 0) {
    const diffY = Math.abs(e.touches[0].clientY - msTouchStartY);
    const diffX = Math.abs(e.touches[0].clientX - msTouchStartX);
    if (diffY > 10 || diffX > 10) {
      msIsScrolling = true;
    }
  }
}, { passive: true });

document.addEventListener('touchend', () => {
  if (msScrollTimer) clearTimeout(msScrollTimer);
  msScrollTimer = setTimeout(() => {
    msIsScrolling = false;
  }, 250);
}, { passive: true });

document.addEventListener('touchcancel', () => {
  if (msScrollTimer) clearTimeout(msScrollTimer);
  msIsScrolling = false;
}, { passive: true });

  if (container._msUpdating) return;
  container._msUpdating = true;

  try {
    const cfg = MULTISELECT_CONFIGS[containerId] || {
      icon: '📌',
      singular: 'elemento',
      plural: 'elementos',
      gender: 'm',
      placeholder: 'Seleccionar elementos…'
    };

    const allChips = container.querySelectorAll('.chip-item');
    const selectedChips = container.querySelectorAll('.chip-item.selected');
    const count = selectedChips.length;

    const textEl = document.getElementById(`ms-text-${containerId}`);
    const badgeEl = document.getElementById(`ms-badge-${containerId}`);

    if (textEl) {
      if (count === 0) {
        textEl.textContent = cfg.placeholder;
        textEl.classList.remove('has-selection');
      } else if (count === 1) {
        const firstChip = selectedChips[0];
        const firstLabel = firstChip.dataset.label || firstChip.dataset.value;
        textEl.textContent = `1 ${cfg.singular}: ${firstLabel}`;
        textEl.classList.add('has-selection');
      } else {
        const selWord = cfg.gender === 'f' ? 'seleccionadas' : 'seleccionados';
        textEl.textContent = `${count} ${cfg.plural} ${selWord}`;
        textEl.classList.add('has-selection');
      }
    }

    if (badgeEl) {
      if (count > 0) {
        badgeEl.textContent = String(count);
        badgeEl.style.display = 'inline-flex';
      } else {
        badgeEl.style.display = 'none';
      }
    }

    const trayEl = document.getElementById(`ms-tags-${containerId}`);
    if (trayEl) {
      if (count > 0) {
        trayEl.style.display = 'flex';
        trayEl.innerHTML = Array.from(selectedChips).map(chip => {
          const val = chip.dataset.value || '';
          const lbl = chip.dataset.label || val;
          return `
          <span class="ms-selected-tag" data-value="${escapeHtml(val)}">
            <span class="ms-tag-text">${escapeHtml(lbl)}</span>
            <button type="button" class="ms-tag-remove" data-container="${containerId}" data-value="${escapeHtml(val)}" onclick="removeSelectedItem('${containerId}', this.dataset.value, event)" title="Quitar ${escapeHtml(lbl)}" aria-label="Quitar ${escapeHtml(lbl)}">✕</button>
          </span>`;
        }).join('') + (count > 1 ? `<button type="button" class="ms-clear-tray-btn" data-container="${containerId}" onclick="clearAllMultiSelect('${containerId}', event)" title="Quitar todas">Limpiar</button>` : '');
      } else {
        trayEl.style.display = 'none';
        trayEl.innerHTML = '';
      }
    }

    if (containerId === 'cent-chips') {
      const preBtn = document.getElementById('btn-grupo-preanalisis');
      const msPreBtn = container.querySelector('.ms-preanalisis-btn');
      const preChips = Array.from(allChips).filter(ch => PREANALISIS.includes(centNum(ch.dataset.value)));
      const allPreSelected = preChips.length > 0 && preChips.every(c => c.classList.contains('selected'));
      if (preBtn) preBtn.classList.toggle('active', allPreSelected);
      if (msPreBtn) msPreBtn.classList.toggle('active', allPreSelected);
    }

    if (containerId === 'rev-chips') {
      const revBtn = document.getElementById('btn-rev-select-all');
      const allSel = allChips.length > 0 && selectedChips.length === allChips.length;
      if (revBtn) revBtn.classList.toggle('active', allSel);
    }
  } finally {
    container._msUpdating = false;
  }
}

function initMultiSelectObserver(containerId) {
  const container = document.getElementById(containerId);
  if (!container || container._msObserverInit) return;
  container._msObserverInit = true;

  if (typeof MutationObserver !== 'undefined') {
    const observer = new MutationObserver((mutations) => {
      if (container._msUpdating) return;
      let shouldUpdate = false;
      for (const m of mutations) {
        if (m.type === 'attributes' && m.attributeName === 'class' && m.target && m.target.classList && m.target.classList.contains('chip-item')) {
          shouldUpdate = true;
          break;
        }
      }
      if (shouldUpdate) {
        updateMultiSelectUI(containerId);
      }
    });

    observer.observe(container, {
      attributes: true,
      attributeFilter: ['class'],
      subtree: true
    });
  }
}

// ── Personal & Responsables Helpers (Optimized O(1) Hash Map) ─
function getNombreResponsable(rawVal) {
  if (!rawVal) return '';
  const trimmed = String(rawVal).trim();
  const upper = trimmed.toUpperCase();
  if (state.personalMap && state.personalMap[upper]) {
    const p = state.personalMap[upper];
    if (p.activo !== 'NO' && p.nombre) return p.nombre;
  }
  return trimmed;
}

function getInicialesResponsable(val) {
  if (!val) return '';
  const trimmed = String(val).trim();
  const upper = trimmed.toUpperCase();
  if (state.personalMap && state.personalMap[upper]) {
    return state.personalMap[upper].iniciales;
  }
  if (state.personalByNameMap && state.personalByNameMap[upper]) {
    return state.personalByNameMap[upper].iniciales;
  }
  if (trimmed.length <= 4) return upper;
  return trimmed.split(/\s+/).map(w => w[0]).join('').toUpperCase().substring(0, 4);
}

function updateResponsableFeedback(inputEl) {
  if (!inputEl) return;
  const val = inputEl.value.trim().toUpperCase();
  let feedbackEl = inputEl.parentElement.querySelector('.resp-feedback');
  if (!feedbackEl) {
    feedbackEl = document.createElement('div');
    feedbackEl.className = 'resp-feedback';
    inputEl.parentElement.appendChild(feedbackEl);
  }
  if (!val) {
    feedbackEl.textContent = '';
    feedbackEl.className = 'resp-feedback';
    return;
  }
  const match = (state.personal || []).find(p => p.iniciales === val && p.activo !== 'NO');
  if (match && match.nombre) {
    feedbackEl.className = 'resp-feedback found';
    feedbackEl.textContent = '✓ ' + match.nombre + (match.estamento ? ' (' + match.estamento + ')' : '');
  } else if (val.length >= 2) {
    feedbackEl.className = 'resp-feedback unknown';
    feedbackEl.textContent = '👤 Inicial nueva (se registrará al guardar)';
  } else {
    feedbackEl.textContent = '';
    feedbackEl.className = 'resp-feedback';
  }
}

function bindResponsableLiveFeedback() {
  const inputs = document.querySelectorAll('input[id$="-resp"], input[id$="-responsable"], #elim-responsable, #rev-admin-revisor, #edit-termo-resp, #edit-cent-resp, #edit-meson-resp, #edit-refri-resp, #edit-limp-refri-resp, #edit-conduct-resp, #edit-cobas-resp');
  inputs.forEach(inp => {
    if (!inp._respBound) {
      inp._respBound = true;
      inp.addEventListener('input', () => updateResponsableFeedback(inp));
      inp.addEventListener('focus', () => updateResponsableFeedback(inp));
    }
  });
}

let nuevoPersonalPromiseResolver = null;

async function ensureResponsableRegistered(rawInitials) {
  if (!rawInitials) return true;
  const val = String(rawInitials).trim().toUpperCase();
  if (!val) return true;

  // Si ya contiene espacios o más de 4 letras, asumir que ya es nombre completo
  if (val.includes(' ') || val.length > 4) return true;

  const match = (state.personal || []).find(p => p.iniciales === val && p.activo !== 'NO');
  if (match && match.nombre) {
    return true; // Ya registrado en maestro
  }

  // Desplegar modal para ingresar nombre
  return new Promise((resolve) => {
    nuevoPersonalPromiseResolver = resolve;
    const modal = document.getElementById('modal-nuevo-personal');
    const initInput = document.getElementById('nuevo-personal-iniciales');
    const nameInput = document.getElementById('nuevo-personal-nombre');
    if (initInput) initInput.value = val;
    if (nameInput) {
      nameInput.value = '';
      setTimeout(() => nameInput.focus(), 150);
    }
    if (modal) {
      const card = modal.querySelector('.modal-card, .nuevo-personal-card') || modal.firstElementChild;
      if (card) card.style.display = 'block';
      modal.style.display = 'flex';
      modal.style.zIndex = '10000';
    }
  });
}

function cerrarModalNuevoPersonal() {
  const modal = document.getElementById('modal-nuevo-personal');
  if (modal) modal.style.display = 'none';
  if (nuevoPersonalPromiseResolver) {
    nuevoPersonalPromiseResolver(false);
    nuevoPersonalPromiseResolver = null;
  }
}

async function handleGuardarNuevoPersonal(e) {
  if (e) e.preventDefault();
  const iniciales = document.getElementById('nuevo-personal-iniciales').value.trim().toUpperCase();
  const nombre = document.getElementById('nuevo-personal-nombre').value.trim().toUpperCase();
  const estamento = document.getElementById('nuevo-personal-estamento').value;

  if (!nombre) {
    showToast('Ingrese su nombre completo', 'warning');
    return;
  }

  const btn = document.getElementById('btn-guardar-nuevo-personal');
  if (btn) btn.disabled = true;

  try {
    const res = await apiPost({
      action: 'savePersonal',
      iniciales: iniciales,
      nombre: nombre,
      estamento: estamento,
      activo: 'SI'
    });

    if (res && res.success) {
      showToast(`✓ Funcionario ${nombre} registrado exitosamente`, 'success');
      if (res.personal) {
        state.personal = res.personal;
      } else {
        state.personal.push({ iniciales, nombre, estamento, activo: 'SI' });
      }
      rebuildPersonalIndex();
      document.querySelectorAll('input[id$="-resp"], input[id$="-responsable"], #elim-responsable').forEach(inp => {
        if (inp.value.trim().toUpperCase() === iniciales) updateResponsableFeedback(inp);
      });
      const modal = document.getElementById('modal-nuevo-personal');
      if (modal) modal.style.display = 'none';
      if (nuevoPersonalPromiseResolver) {
        nuevoPersonalPromiseResolver(true);
        nuevoPersonalPromiseResolver = null;
      }
    } else {
      showToast(res.error || 'Error al registrar funcionario', 'error');
    }
  } catch (err) {
    showToast('Error de conexión: ' + err.toString(), 'error');
  } finally {
    if (btn) btn.disabled = false;
  }
}

        if(!opt && attempts > 5) {

          opt.textContent = area;

      if(chips.length){

        });

          opt.textContent = cobasEq;

        if (!s) return false;
        const target = decodedSector.toLowerCase();
        const opt = Array.from(s.options).find(o => o.value.trim().toLowerCase() === target);
        if (opt) {
          s.value = opt.value;
          if (typeof onElimSectorChange === 'function') onElimSectorChange();
          return true;
        }
        return false;
      };
      if (!setSector()) {
        const w = setInterval(() => {
          if (setSector()) clearInterval(w);
        }, 100);
        setTimeout(() => clearInterval(w), 5000);
      }
    }
    navigateTo('elim-muestras');
  }
}

// Dashboard cache & prefetch (decoupled with debounce)
let _prefetchDashboardTimer = null;
function prefetchDashboard(delay = 2000){
  if (_prefetchDashboardTimer) clearTimeout(_prefetchDashboardTimer);
  _prefetchDashboardTimer = setTimeout(() => {
    const mes=state.dashMes,anio=state.dashAnio;
    const key=mes+'-'+anio;
    apiGet({action:'getRegistros',mes:mes,anio:anio}).then(function(reg){
      const rev = reg.revisiones || null;
      state.dashCache={key:key,data:reg,rev:rev,timestamp:Date.now()};
    }).catch(function(){/* silent fail */});
  }, delay);
}
function getCacheAge(){
  if(!state.dashCache)return Infinity;
  return(Date.now()-state.dashCache.timestamp)/1000/60; // minutes
}
function updateCacheIndicator(){
  const el=document.getElementById('dash-cache-indicator');
  if(!el)return;
  if(!state.dashCache){el.style.display='none';return;}
  const mins=Math.round(getCacheAge());
  if(mins<1){el.textContent='✓ Actualizado';el.className='cache-indicator cache-fresh'}
  else if(mins<5){el.textContent='hace '+mins+' min';el.className='cache-indicator cache-fresh'}
  else{el.textContent='hace '+mins+' min';el.className='cache-indicator cache-stale'}
  el.style.display='inline-block';
}
